[project]
name = "assayr"
version = "0.9.0"
description = "Assayr - on-premise GRC for ISO/IEC 27001"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pg8000>=1.31",
  "argon2-cffi>=23.1",
  "typer>=0.12",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "cryptography>=43",
]

[dependency-groups]
dev = ["pytest>=8.2", "httpx2", "ruff>=0.6"]

[project.scripts]
assayr = "assayr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assayr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]  # Depends() in defaults is idiomatic FastAPI; the formatter owns line length
