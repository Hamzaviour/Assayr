name: ci

# Manual only: GitHub Actions minutes are limited. Run from the Actions tab when needed.
on:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: assayr_test
          POSTGRES_USER: assayr
          POSTGRES_PASSWORD: assayr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U assayr"
          --health-interval 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Tests (SQLite)
        run: uv run pytest -W error
      - name: Tests (PostgreSQL 16)
        run: uv run pytest -W error
        env:
          ASSAYR_TEST_DATABASE_URL: postgresql+pg8000://assayr:assayr@localhost:5432/assayr_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/smoke.sh
